<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="COF 필터">
<title>COF 종목필터</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{--bg:#F3F4F7;--surface:#fff;--ink:#141821;--muted:#5A6275;--line:#DDE1E9;--accent:#B87411;--accent-soft:#FBF1E1;
--up:#D21F3C;--up-soft:#FDECEF;--down:#1E5BC6;--down-soft:#E9F0FC;--buy:#12A06A;--sell:#E0455A;
--f-body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;--f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0D1016;--surface:#161A22;--ink:#E6E9EF;--muted:#8C94A6;--line:#272D39;--accent:#E3A440;--accent-soft:#2A2214;
--up:#FF5C70;--up-soft:#33171D;--down:#6A9AF2;--down-soft:#152238;--buy:#2FD08F;--sell:#FF6B7D;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
padding:env(safe-area-inset-top,0) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}.up{color:var(--up)}.down{color:var(--down)}
header{position:sticky;top:0;background:var(--bg);padding:14px 0 10px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:2}
.brand{font-weight:700;font-size:17px}.brand b{color:var(--accent)}
select,button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px}
header select{margin-left:auto}
.tabs{display:flex;gap:6px}.tabs button{border-radius:99px;font-weight:700;color:var(--muted);cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.meta{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.row h3{margin:0;font-size:18px}.row .p{margin-left:auto;font-size:18px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font-size:12px;border:1px solid var(--buy);color:var(--buy);border-radius:6px;padding:1px 8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 10px;font-size:13px}.grid div{min-width:0}.grid span{display:block;color:var(--muted);font-size:11px}
canvas{width:100%;height:220px;display:block}
.empty{border:1px dashed var(--line);border-radius:12px;padding:20px;color:var(--muted)}
.disc{font-size:12px;color:var(--muted)}
@media (max-width:420px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">COF <b>종목필터</b></div>
    <select id="day" aria-label="기준일"></select>
  </header>
  <div class="tabs" role="group" aria-label="스타일">
    <button type="button" data-k="danta" aria-pressed="true">단타</button>
    <button type="button" data-k="swing" aria-pressed="false">스윙</button>
  </div>
  <div class="meta" id="meta"></div>
  <div id="list" class="wrap" style="gap:12px"><div class="empty">데이터를 불러오는 중입니다.</div></div>
  <p class="disc">KRX 일별 시세·투자자별 순매수로 계산한 기계적 필터 결과입니다. X-ray 거래량의 매수/매도 몫은 봉 모양으로 추정한 값이며, 매수·매도 추천이 아닙니다.</p>
</div>
<script>
const $=s=>document.querySelector(s);
const fmt=(n,d=0)=>n==null?"–":Number(n).toLocaleString("ko-KR",{minimumFractionDigits:d,maximumFractionDigits:d});
const sg=n=>n>0?"+":"";const cl=n=>n>0?"up":n<0?"down":"";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let data=null,kind="danta";
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function draw(cv,bars){
  const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;
  const g=cv.getContext("2d");g.scale(dpr,dpr);g.clearRect(0,0,w,h);
  const ph=h*0.62,vh=h*0.32,vy=h; const n=bars.length,bw=w/n;
  const hi=Math.max(...bars.map(b=>b.h)),lo=Math.min(...bars.map(b=>b.l)),vmax=Math.max(...bars.map(b=>b.v));
  const y=p=>4+(hi-p)/(hi-lo||1)*(ph-8);
  g.strokeStyle=css("--line");g.lineWidth=1;g.beginPath();g.moveTo(0,ph+2);g.lineTo(w,ph+2);g.stroke();
  bars.forEach((b,i)=>{const x=i*bw+bw/2,col=b.c>=b.o?css("--up"):css("--down");
    g.strokeStyle=col;g.beginPath();g.moveTo(x,y(b.h));g.lineTo(x,y(b.l));g.stroke();
    g.fillStyle=col;const t=y(Math.max(b.o,b.c)),bt=y(Math.min(b.o,b.c));g.fillRect(x-bw*0.35,t,bw*0.7,Math.max(1,bt-t));
    const vt=b.v/vmax*vh,st=(b.v-b.buy)/vmax*vh;
    g.fillStyle=css("--buy");g.fillRect(i*bw+bw*0.1,vy-vt,bw*0.8,vt-st);
    g.fillStyle=css("--sell");g.fillRect(i*bw+bw*0.1,vy-st,bw*0.8,st);});
  g.fillStyle=css("--muted");g.font="11px "+css("--f-num");g.fillText(fmt(hi),4,12);g.fillText(fmt(lo),4,ph-4);
  g.fillText("X-ray 거래량 (초록 매수 / 빨강 매도)",4,ph+16);
}

function render(){
  const rows=(data&&data[kind])||[];
  $("#meta").textContent=data?`${data.date} 기준 · ${data.generatedAt.slice(11,16)} 생성 · 후보 ${rows.length}개`:"";
  if(!rows.length){$("#list").innerHTML=`<div class="empty">이날 조건을 모두 통과한 ${kind==="danta"?"단타":"스윙"} 후보가 없습니다.</div>`;return;}
  $("#list").innerHTML=rows.map((r,i)=>`<article class="card">
    <div class="row"><h3>${esc(r.name)}</h3><span class="meta">${esc(r.ticker)} ${esc(r.market)}</span><span class="p num ${cl(r.pct)}">${sg(r.pct)}${fmt(r.pct,2)}%</span></div>
    <div class="chips">${(kind==="danta"?r.danta_tags:r.swing_tags).map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div>
    <div class="grid num">
      <div><span>종가</span>${fmt(r.close)}</div><div><span>거래대금</span>${fmt(r.value_eok)}억</div><div><span>평소 대비</span>x${fmt(r.turnover_x,1)}</div>
      <div><span>20일선 이격</span>${sg(r.disp20)}${fmt(r.disp20,1)}%</div><div><span>외국인 오늘</span><b class="${cl(r.frgn_today_eok)}">${sg(r.frgn_today_eok)}${fmt(r.frgn_today_eok,1)}억</b></div><div><span>기관 오늘</span><b class="${cl(r.inst_today_eok)}">${sg(r.inst_today_eok)}${fmt(r.inst_today_eok,1)}억</b></div>
      <div><span>외국인 20일 매수일</span>${fmt(r.frgn_days20)}/20</div><div><span>외국인 20일 누적</span>${sg(r.frgn_cum20_eok)}${fmt(r.frgn_cum20_eok,1)}억</div><div><span>60일 고가</span>${fmt(r.high60)}</div>
    </div>
    <canvas id="cv${i}" aria-label="${esc(r.name)} 60일 캔들과 X-ray 거래량"></canvas>
  </article>`).join("");
  rows.forEach((r,i)=>r.bars&&draw(document.getElementById("cv"+i),r.bars));
}
async function load(date){
  try{const res=await fetch(`data/${date}.json`,{cache:"no-store"});data=await res.json();}catch(e){data=null;$("#list").innerHTML='<div class="empty">데이터를 불러오지 못했습니다.</div>';return;}
  render();
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{kind=b.dataset.k;document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-pressed",x===b));render();});
$("#day").onchange=e=>load(e.target.value);
window.addEventListener("resize",()=>data&&render());
(async()=>{
  let dates=[];try{dates=await (await fetch("data/index.json",{cache:"no-store"})).json();}catch(e){}
  if(!dates.length){$("#list").innerHTML='<div class="empty">아직 결과가 없습니다. GitHub Actions에서 첫 실행을 마치면 여기에 나타납니다.</div>';return;}
  $("#day").innerHTML=dates.map(d=>`<option>${d}</option>`).join("");load(dates[0]);
})();
</script>
</body>
</html>
