name: 매매 점검 루프 (미장 10년 · 시험→원인→수정안→다시 시험)

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: "무작위 몇 번 평균"
        required: false
        default: "6"
  schedule:
    - cron: "20 2 * * 0"   # 매주 일요일 11:20(한국) — 미장 주간 장 끝난 뒤

permissions:
  contents: write

concurrency:
  group: trading-loop
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt lxml html5lib
      - name: 미장 10년 일봉 받기
        run: python tossbot/tools/swing_data.py us --years 10 --out loopdata && mv loopdata/swing-us.pkl.gz loopdata/s10-us.pkl.gz
      - name: 과거 정보(애널리스트 등급·내부자 거래) 받기
        run: curl -sfL -o loopdata/hist-us.json.gz https://raw.githubusercontent.com/${{ github.repository }}/loophist/hist-us.json.gz || true
      - name: 점수 미리 계산
        env:
          LOOP_DATA: ${{ github.workspace }}/loopdata
          BT_PRE: s10-
          BT_FEAT: feat10-
          LOOP_PROCS: "2"
        run: python tossbot/tools/loop/feat.py us
      - name: 루프 돌리기
        env:
          LOOP_DATA: ${{ github.workspace }}/loopdata
        run: python tossbot/tools/loop/trading_loop.py --seeds ${{ github.event.inputs.seeds || '6' }} --rounds 3
      - name: 결과·실패 기록 올리기
        run: |
          git config user.name "cof-bot" && git config user.email "cof-bot@users.noreply.github.com"
          git add tossbot/research
          git commit -qm "매매 점검 루프 결과 $(date -u +%F)" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
