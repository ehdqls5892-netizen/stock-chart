name: 스윙 연구 자료 10년 국장 (검증용)

on:
  push:
    branches: [main]
    paths: [".github/workflows/swingdata10kr.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt lxml html5lib
      - name: 시장 정하기
        id: mk
        run: |
          echo "m=kr" >> $GITHUB_OUTPUT; echo "y=10" >> $GITHUB_OUTPUT
      - name: 자료 모으기
        run: python tossbot/tools/swing_data.py ${{ steps.mk.outputs.m }} --years ${{ steps.mk.outputs.y }} --out out 2> >(tee out.log >&2)
      - name: 올리기 (swingdata-<m> 브랜치)
        if: always()
        run: |
          mkdir -p out && cp -f out.log out/run.log 2>/dev/null || true
          cd out
          git init -q && git checkout -q -b swingdata10-${{ steps.mk.outputs.m }}
          git config user.name "cof-bot" && git config user.email "cof-bot@users.noreply.github.com"
          git add -A && git commit -qm "스윙 자료 $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" swingdata10-${{ steps.mk.outputs.m }}
