name: 스윙 신호 종목 (장 마감 뒤)

on:
  schedule:
    - cron: "15 9 * * 1-5"    # 국장: 18:15(한국) — 야후 일봉 반영 뒤
    - cron: "25 22 * * 1-5"   # 미장: 뉴욕 장 마감 뒤
  push:                       # 신호 코드가 바뀌면 국장·미장 후보를 바로 다시 만듦
    branches: [main]
    paths: ["tossbot/tools/swing_picks.py"]
  workflow_dispatch:
    inputs:
      market:
        description: "kr 또는 us"
        required: true
        default: "kr"

permissions:
  contents: write

concurrency:
  group: swingpicks-${{ github.event.inputs.market || github.event.schedule }}
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        mm: ${{ fromJSON(github.event_name == 'push' && '["kr","us"]' || '["auto"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt lxml html5lib
      - name: 시장 정하기
        id: mk
        run: |
          if [ "${{ matrix.mm }}" != "auto" ]; then M="${{ matrix.mm }}";
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then M="${{ github.event.inputs.market }}";
          elif [ "${{ github.event.schedule }}" = "15 9 * * 1-5" ]; then M=kr; else M=us; fi
          echo "m=$M" >> $GITHUB_OUTPUT
      - name: 신호 계산
        run: python tossbot/tools/swing_picks.py ${{ steps.mk.outputs.m }} --out out 2> >(tee out.log >&2)
      - name: 올리기 (swingpicks-<m> 브랜치)
        if: always()
        run: |
          mkdir -p out && cp -f out.log out/run.log 2>/dev/null || true
          cd out
          git init -q && git checkout -q -b swingpicks-${{ steps.mk.outputs.m }}
          git config user.name "cof-bot" && git config user.email "cof-bot@users.noreply.github.com"
          git add -A && git commit -qm "스윙 신호 $(date -u +%F)"
          BR=swingpicks-${{ steps.mk.outputs.m }}
          [ -f picks.json ] || BR=$BR-log
          git branch -m "$BR"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$BR"
