name: 점검 루프용 과거 정보 모으기 (애널리스트 등급·내부자 거래)
on:
  workflow_dispatch:
  schedule:
    - cron: "40 14 * * *"   # 매일 23:40(한국) — 무료 한도 안에서 나눠 받음
permissions:
  contents: write
concurrency:
  group: loop-hist
jobs:
  hist:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt lxml html5lib
      - name: 지난번까지 모은 것 받기
        run: |
          mkdir -p hist
          curl -sfL -o hist/hist-us.json.gz https://raw.githubusercontent.com/${{ github.repository }}/loophist/hist-us.json.gz || rm -f hist/hist-us.json.gz
      - name: 더 모으기
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          FMP_KEY: ${{ secrets.FMP_KEY }}
        run: python tossbot/tools/loop/hist_collect.py --out hist --fmp 150
      - name: 올리기 (loophist 브랜치)
        run: |
          cd hist
          git init -q && git checkout -q -b loophist
          git config user.name "cof-bot" && git config user.email "cof-bot@users.noreply.github.com"
          git add -A && git commit -qm "과거 정보 $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" loophist
