name: 미국장 마감 차트 분석

on:
  schedule:
    - cron: "35 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pandas numpy yfinance==1.7.0
      - name: 차트 분석 (미국)
        run: python screener/chart.py us
      - name: Commit results
        run: |
          git config user.name "cof-bot"
          git config user.email "cof-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "data: $(date -u +%F) 미국장 차트"
          git pull --rebase && git push
