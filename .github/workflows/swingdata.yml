name: 스윙 연구 자료 (일봉 3년·수급·실적)

on:
  workflow_dispatch:
    inputs:
      market:
        description: "kr 또는 us"
        required: true
        default: "us"
      years:
        description: "몇 년"
        required: true
        default: "3"
  schedule:
    - cron: "10 23 * * 6"   # 매주 일요일 08:10(한국) 미장
    - cron: "40 23 * * 6"   # 국장

permissions:
  contents: write

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt lxml html5lib
      - name: 시장 정하기
        id: mk
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then M="${{ github.event.inputs.market }}"; Y="${{ github.event.inputs.years }}";
          elif [ "${{ github.event.schedule }}" = "10 23 * * 6" ]; then M=us; Y=3; else M=kr; Y=3; fi
          echo "m=$M" >> $GITHUB_OUTPUT; echo "y=$Y" >> $GITHUB_OUTPUT
      - name: 자료 모으기
        run: python tossbot/tools/swing_data.py ${{ steps.mk.outputs.m }} --years ${{ steps.mk.outputs.y }} --out out 2> >(tee out.log >&2)
      - name: 올리기 (swingdata-<m> 브랜치)
        if: always()
        run: |
          mkdir -p out && cp -f out.log out/run.log 2>/dev/null || true
          cd out
          git init -q && git checkout -q -b swingdata-${{ steps.mk.outputs.m }}
          git config user.name "cof-bot" && git config user.email "cof-bot@users.noreply.github.com"
          git add -A && git commit -qm "스윙 자료 $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" swingdata-${{ steps.mk.outputs.m }}
