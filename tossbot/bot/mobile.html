<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="토스봇">
<meta name="theme-color" content="#101318">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>토스봇</title>
<style>
:root{--bg:#F2F4F6;--card:#fff;--ink:#191F28;--muted:#6B7684;--line:#E5E8EB;--blue:#3182F6;--blue-soft:#E8F3FF;
  --up:#F04452;--up-soft:#FEEBEC;--ok:#12B76A;--ok-soft:#E7F8EF;--warn:#F79009;--warn-soft:#FEF4E6;--tab:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#101318;--card:#1B1F26;--ink:#E9ECEF;--muted:#98A2B3;--line:#2A3039;
  --blue-soft:#14243A;--up-soft:#3A1A1E;--ok-soft:#12301F;--warn-soft:#3A2A12;--tab:#161A20}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;display:flex;align-items:center;gap:8px}
header h1{font-size:20px;margin:0}
.badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--line);color:var(--muted)}
.badge.live{background:var(--up);color:#fff}.badge.paper{background:var(--blue-soft);color:var(--blue)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}.dot.on{background:var(--ok)}
#upd{margin-left:auto;font-size:12px;color:var(--muted)}
main{padding:4px 16px calc(84px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:18px;padding:14px 16px}
.row{display:flex;align-items:center;gap:8px}.sp{flex:1}
.muted{color:var(--muted)}.small{font-size:12px}.b{font-weight:700}
.up{color:var(--up)}.down{color:var(--blue)}
.big{font-size:26px;font-weight:800;letter-spacing:-.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mk h3{margin:0 0 4px;font-size:14px}.mk .v{font-size:17px;font-weight:700}
.chip{display:inline-block;white-space:nowrap;flex:none;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--muted);margin-right:4px}
.chip.A{background:var(--ok-soft);color:var(--ok)}.chip.B{background:var(--blue-soft);color:var(--blue)}.chip.C{background:var(--line)}
.chip.pos{background:var(--ok-soft);color:var(--ok)}.chip.neg{background:var(--up-soft);color:var(--up)}.chip.mid{background:var(--warn-soft);color:var(--warn)}
.chip.lock{background:var(--blue-soft);color:var(--blue)}
.h{border-top:1px solid var(--line);padding:12px 0}.h:first-child{border-top:0;padding-top:2px}
.h .nm{font-weight:700;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h .row,.pk .row{flex-wrap:nowrap}.pk .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.kv{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted);margin-top:4px}.kv b{color:var(--ink);font-weight:600}
.why{font-size:12px;color:var(--muted);margin-top:6px}
.btns{display:flex;gap:8px;margin-top:10px}
button{font:inherit;font-weight:700;white-space:nowrap;border:0;border-radius:12px;padding:11px 12px;background:var(--line);color:var(--ink);cursor:pointer}
button.pri{background:var(--blue);color:#fff}button.dan{background:var(--up-soft);color:var(--up)}button.full{width:100%}
button.sm{padding:8px 10px;font-size:13px;flex:1}
button:disabled{opacity:.45}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px}.seg button{flex:1;background:transparent;padding:8px;border-radius:10px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink)}
.pk{border-top:1px solid var(--line);padding:12px 0}.pk:first-child{border-top:0}
.ai{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--bg);font-size:13px}
.ai .t{font-weight:700;margin-bottom:2px}
.veto{background:var(--up-soft);color:var(--up);font-weight:700;padding:8px 12px;border-radius:12px;margin-top:8px;font-size:13px}
details summary{cursor:pointer;color:var(--muted);font-size:12px;margin-top:6px}
pre{white-space:pre-wrap;word-break:break-word;font:13px/1.55 -apple-system,"Apple SD Gothic Neo",sans-serif;margin:0}
.log{font-size:12px;line-height:1.5;border-top:1px solid var(--line);padding:6px 0}
input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);width:100%}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--tab);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:transparent;color:var(--muted);font-size:11px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px;line-height:1}nav button.on{color:var(--ink)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));background:var(--ink);color:var(--card);padding:12px 14px;border-radius:14px;font-size:14px;z-index:9;display:none;white-space:pre-wrap}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:none;align-items:flex-end}
.sheet .in{background:var(--card);width:100%;border-radius:20px 20px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 8px}
.empty{color:var(--muted);text-align:center;padding:18px 0;font-size:14px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:r 1s linear infinite;vertical-align:-2px}
@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header><h1>토스봇</h1><span id="mode" class="badge">…</span><span id="dot" class="dot"></span><span id="upd"></span></header>
<main id="v"></main>
<nav id="nav"></nav>
<div class="toast" id="toast"></div>
<div class="sheet" id="sheet"><div class="in"><h3 id="sh-t"></h3><div id="sh-b" class="muted" style="margin-bottom:14px"></div>
  <div class="row"><button class="sp" onclick="closeSheet()">취소</button><button class="sp dan" id="sh-ok">실행</button></div></div></div>
<script>
"use strict";
const TABS=[["home","🏠","홈"],["picks","🧭","후보"],["brief","📰","분석"],["log","📜","기록"],["more","⚙️","설정"]];
const FL={KR:"🇰🇷",US:"🇺🇸"}, NM={KR:"국장",US:"미장"};
let tab=localStorageGet("tab")||"home", pmk=localStorageGet("pmk")||"KR", D=null, P={}, T={}, logq="";
function localStorageGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function localStorageSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function money(v,mk){if(v==null||isNaN(v))return"–";return mk==="US"?"$"+Number(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}):Math.round(v).toLocaleString("ko-KR")+"원"}
function smoney(v,mk){if(v==null)return"–";return(v>0?"+":v<0?"-":"")+money(Math.abs(v),mk)}
function cls(v){return v>0?"up":v<0?"down":""}
function pct(v){return v==null?"–":(v>0?"+":"")+v.toFixed(2)+"%"}
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",4200)}
async function api(path,body){
  const o=body?{method:"POST",headers:{"Content-Type":"application/json","X-Req":"1"},body:JSON.stringify(body)}:{};
  const r=await fetch(path,o); if(r.status===401) throw new Error("접속 권한이 없어요"); return r.json()}
function ask(title,text,fn){$("sh-t").textContent=title;$("sh-b").textContent=text;$("sheet").style.display="flex";
  $("sh-ok").onclick=async()=>{closeSheet();await fn()}}
function closeSheet(){$("sheet").style.display="none"}
$("sheet").addEventListener("click",e=>{if(e.target.id==="sheet")closeSheet()});

function nav(){$("nav").innerHTML=TABS.map(([k,i,n])=>`<button class="${k===tab?"on":""}" onclick="go('${k}')"><span>${i}</span>${n}</button>`).join("")}
function go(k){tab=k;localStorageSet("tab",k);nav();render();window.scrollTo(0,0)}

async function load(){
  try{D=await api("/api/m/home");$("upd").textContent=new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});}
  catch(e){$("upd").textContent="연결 끊김"; if(!D){$("v").innerHTML=`<div class="card empty">${esc(e.message)}<br>Tailscale 이 켜져 있는지 확인하세요.</div>`;return}}
  $("mode").className="badge "+(D.running?(D.mode==="live"?"live":"paper"):"");
  $("mode").textContent=D.running?(D.mode==="live"?"실전":"연습"):"꺼짐";
  $("dot").className="dot"+(D.running?" on":"");
  if(tab==="home"||tab==="log"||tab==="more")render();
}

function render(){({home:vHome,picks:vPicks,brief:vBrief,log:vLog,more:vMore}[tab]||vHome)()}

function vHome(){
  if(!D){$("v").innerHTML=`<div class="card empty"><span class="spin"></span> 불러오는 중</div>`;return}
  const hs=D.holdings||[]; let tot=0, val=0, fxok=true;
  hs.forEach(h=>{if(h.pnl!=null){if(h.fx){tot+=h.pnl*h.fx;val+=(h.value||0)*h.fx}else fxok=false}});
  let h=`<div class="card"><div class="muted small">보유 평가손익${fxok?" (원화 환산)":""}</div>
    <div class="big ${cls(tot)}">${hs.length?smoney(tot,"KR"):"보유 없음"}</div>
    ${hs.length?`<div class="muted small">평가금액 ≈ ${money(val,"KR")}</div>`:""}</div>`;
  h+=`<div class="grid2">`+Object.entries(D.markets||{}).map(([mk,x])=>`<div class="card mk">
     <h3>${FL[mk]} ${NM[mk]}</h3><div class="muted small">${esc(x.phase||"")}</div>
     <div class="v ${cls(x.realized)}">${smoney(x.realized||0,mk)}</div><div class="muted small">오늘 확정 · 매수 ${x.trades||0}회</div>
     <div class="muted small">투자금 ${money(x.capital,mk)}${x.invested?` · 사용 ${money(x.invested,mk)}`:""}</div>
     ${x.halted?`<div class="small up">⛔ ${esc(x.halted)}</div>`:""}${x.error?`<div class="small up">❌ ${esc(x.error)}</div>`:""}</div>`).join("")+`</div>`;
  h+=`<div class="card"><div class="row"><b>보유 종목</b><span class="sp"></span><button class="sm" style="flex:0" onclick="load()">새로고침</button></div>`;
  if(!hs.length) h+=`<div class="empty">로봇이 관리하는 보유 종목이 없어요</div>`;
  hs.forEach((x,i)=>{const mk=x.market, g=x.grade?`<span class="chip ${x.grade==="유지"?"pos":x.grade==="나쁨"?"neg":"mid"}">${esc(x.grade)}</span>`:"";
    h+=`<div class="h"><div class="row"><span class="nm">${FL[mk]} ${esc(x.name)}</span><span class="sp"></span><span class="b ${cls(x.pct)}">${pct(x.pct)}</span></div>
      <div style="margin-top:4px">${x.locked?'<span class="chip lock">🔒 잠금</span>':""}${x.swing?'<span class="chip">스윙</span>':""}${g}</div>
      <div class="kv"><span>${x.qty}주</span><span>현재 <b>${money(x.last,mk)}</b></span><span>평가 <b class="${cls(x.pnl)}">${smoney(x.pnl,mk)}</b></span>
      <span>산 값 ${money(x.entry,mk)}</span><span>손절선 ${money(x.sl,mk)}</span>${x.days?`<span>${x.days}일째</span>`:""}</div>
      ${(x.why||[]).length?`<div class="why">${x.why.slice(0,3).map(esc).join(" · ")}</div>`:""}
      ${x.state==="open"?`<div class="btns"><button class="sm" onclick="lock(${i})">${x.locked?"🔓 잠금 해제":"🔒 잠금"}</button>
        <button class="sm dan" onclick="sell(${i})">💰 팔기</button></div>`:`<div class="small muted">파는 중…</div>`}</div>`});
  h+=`</div>`;
  const cl=D.closed||[];
  if(cl.length){h+=`<div class="card"><b>오늘 매도</b>`+cl.slice(-10).reverse().map(c=>`<div class="h"><div class="row"><span>${FL[c.market]||""} ${esc(c.name)}</span><span class="sp"></span>
    <span class="${cls(c.pnl)} b">${c.pct!=null?pct(c.pct):""} ${smoney(c.pnl,c.market)}</span></div><div class="why">${esc(c.why||"")}</div></div>`).join("")+`</div>`}
  $("v").innerHTML=h;
}
async function lock(i){const x=D.holdings[i];const r=await api("/api/m/lock",{market:x.market,symbol:x.symbol,on:!x.locked});toast(r.msg||"");load()}
function sell(i){const x=D.holdings[i];ask("💰 지금 팔까요?",`${x.name} ${x.qty}주를 시장가로 팔아요. 로봇은 계속 돌아요.`,async()=>{const r=await api("/api/m/sell",{market:x.market,symbol:x.symbol});toast(r.msg||"");load()})}

async function vPicks(){
  let h=`<div class="seg">${["KR","US"].map(m=>`<button class="${m===pmk?"on":""}" onclick="setPmk('${m}')">${FL[m]} ${NM[m]}</button>`).join("")}</div>`;
  const d=P[pmk];
  if(!d){$("v").innerHTML=h+`<div class="card empty"><span class="spin"></span> 후보 불러오는 중</div>`;
    try{P[pmk]=await api("/api/m/picks?mk="+pmk)}catch(e){P[pmk]={error:e.message,picks:[]}} if(tab==="picks")vPicks();return}
  h+=`<div class="card"><div class="row"><div><b>${d.date||""} 종가 기준 후보</b><div class="muted small">현재·미래 점수 순 · 장 마감 15분 전 다시 점검하고 삼</div></div></div>
    <div class="btns"><button class="sm" onclick="loadTable()">📋 오늘 매수 판단표</button><button class="sm" onclick="P['${pmk}']=null;vPicks()">새로고침</button></div>
    <div id="tbl"></div></div>`;
  if(d.error)h+=`<div class="card empty">${esc(d.error)}</div>`;
  h+=`<div class="card">`+((d.picks||[]).map(x=>{const a=x.ai, vw=a?(a.view==="긍정"?"pos":a.view==="부정"?"neg":"mid"):"";
    return `<div class="pk"><div class="row"><span class="nm b">${esc(x.name)}</span><span class="chip ${x.grade||""}">${x.grade||""} ${x.score>0?"+":""}${x.score??""}</span>
      ${a?`<span class="chip ${vw}">AI ${esc(a.view||"")}${a.adj?` ${a.adj>0?"+":""}${a.adj}`:""}</span>`:""}<span class="sp"></span><span class="small muted">${esc(x.sector||"")}</span></div>
      <div class="kv"><span>종가 <b>${money(x.close,pmk)}</b></span><span>손절 ${money(x.stop,pmk)} (${x.close?((x.stop/x.close-1)*100).toFixed(1):"–"}%)</span>
      ${x.tgt_up!=null?`<span>목표가 여력 ${(x.tgt_up*100).toFixed(0)}%</span>`:""}${x.earn?`<span>실적 ${esc(String(x.earn).slice(0,10))}</span>`:""}</div>
      ${a&&a.veto?`<div class="veto">⛔ AI 매수 금지: ${esc(a.veto)}</div>`:""}
      ${x.dart&&x.dart.length?`<div class="veto">⚠️ 최근 공시: ${x.dart.map(esc).join(" · ")}</div>`:""}
      ${a?`<div class="ai"><div class="t">${a.final?"AI 최종 판독":"AI 1차 판독"}</div><div>💡 ${esc(a.catalyst||"")}</div><div class="up" style="margin-top:4px">⚠️ ${esc(a.risk||"")}</div></div>`:""}
      <details><summary>점수 근거${x.news&&x.news.length?" · 기사":""}</summary><div class="why">${esc(x.reason)}</div>
      ${(x.news||[]).map(n=>`<div class="why">📰 ${esc(n)}</div>`).join("")}</details></div>`}).join("")||`<div class="empty">후보 없음</div>`)+`</div>`;
  $("v").innerHTML=h;
}
function setPmk(m){pmk=m;localStorageSet("pmk",m);vPicks()}
async function loadTable(){$("tbl").innerHTML=`<div class="why"><span class="spin"></span> 판단표 만드는 중 (종목마다 몇 초)</div>`;
  try{const r=await api("/api/m/table?mk="+pmk);$("tbl").innerHTML=`<pre class="why" style="margin-top:10px">${esc(r.text||r.error)}</pre>`}catch(e){$("tbl").textContent=e.message}}

function vBrief(){
  const btn=(k,t)=>`<button class="sm" onclick="runCmd('${k}')">${t}</button>`;
  let h=`<div class="card"><b>보고서</b><div class="muted small">텔레그램 버튼과 같은 내용이에요. 분석은 종목마다 몇 초 걸려요.</div>
    <div class="btns">${btn("분석","📰 보유 분석")}${btn("성적","📈 성적")}</div><div class="btns">${btn("진단","🔍 진단")}${btn("매수기록","🧾 매수 기록")}${btn("스윙","🧭 스윙")}</div></div>`;
  h+=Object.entries(T).reverse().map(([k,v])=>`<div class="card"><div class="row"><b>${esc(k)}</b><span class="sp"></span><span class="small muted">${esc(v.at)}</span></div>
    ${v.busy?`<div class="why"><span class="spin"></span> 모으는 중…</div>`:v.texts.map(t=>`<pre style="margin-top:8px">${esc(t)}</pre>`).join("")}</div>`).join("");
  $("v").innerHTML=h;
}
async function runCmd(k){delete T[k];T[k]={busy:true,texts:[],at:new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})};vBrief();
  try{const r=await api("/api/m/cmd",{text:k});T[k]={texts:r.texts||[r.msg],at:T[k].at}}catch(e){T[k]={texts:[e.message],at:T[k].at}}
  if(tab==="brief")vBrief()}

function vLog(){
  if(!D)return vHome();
  const re=/매수|매도|체결|익절|손절|건너뜀|안 사요|멈춰|⛔|오류|AI|🧭/;
  let L=(D.log||[]).slice().reverse().filter(x=>logq?x.includes(logq):re.test(x));
  $("v").innerHTML=`<div class="card"><input id="lq" placeholder="찾기 (종목 이름 등) — 비우면 중요한 것만" value="${esc(logq)}"></div>
    <div class="card">${L.map(x=>`<div class="log">${esc(x)}</div>`).join("")||`<div class="empty">기록 없음 (로봇이 다시 켜지면 그 전 기록은 사라져요)</div>`}</div>`;
  const q=$("lq");q.oninput=()=>{logq=q.value;clearTimeout(q._t);q._t=setTimeout(()=>{vLog();const n=$("lq");n.focus();n.setSelectionRange(n.value.length,n.value.length)},400)};
}

function vMore(){
  if(!D)return vHome();
  const cap=D.capitals||{}, on=D.running;
  $("v").innerHTML=`<div class="card"><b>로봇</b><div class="muted small">지금: ${on?(D.mode==="live"?"🔴 실전 실행 중":"연습 실행 중"):"꺼져 있음"}</div>
    ${on?`<div class="btns"><button class="sm" onclick="stopBot('keep')">⏹ 끄기 (보유 유지)</button><button class="sm dan" onclick="stopBot('sell')">💰 전부 팔고 끄기</button></div>`
       :`<div class="btns"><button class="sm" onclick="startBot('paper')">▶️ 연습 시작</button><button class="sm dan" onclick="startBot('live')">🔴 실전 시작</button></div>`}
    <div class="btns"><button class="sm" onclick="lockAll()">🔒 전부 잠금</button><button class="sm" onclick="resume()">▶️ 낙폭 멈춤 재개</button></div></div>
  <div class="card"><b>오늘 투자금</b>${["KR","US"].map(m=>`<div class="row" style="margin-top:8px"><span style="flex:none;white-space:nowrap">${FL[m]} ${NM[m]}</span>
    <input id="cap${m}" inputmode="decimal" placeholder="${money(cap[m],m)}"><button class="sm" style="flex:0 0 64px" onclick="setCap('${m}')">저장</button></div>`).join("")}
    <div class="why">국장은 원, 미장은 달러로 적어요. 이미 산 종목은 그대로예요.</div></div>
  <div class="card"><b>업데이트</b><div class="muted small">GitHub 새 버전을 받아 시험 후 적용해요 (1~2분, 보유 종목은 이어서 관리).</div>
    <div class="btns"><button class="sm pri" onclick="upd()">🆕 지금 업데이트</button></div></div>
  <div class="card small muted">홈 화면에 추가: 아이폰은 Safari 공유 버튼 → '홈 화면에 추가', 안드로이드는 Chrome 메뉴 → '앱 설치'.<br>알림은 지금처럼 텔레그램으로 와요.</div>`;
}
function startBot(m){ask(m==="live"?"🔴 실전 시작":"▶️ 연습 시작",m==="live"?"실제 돈으로 주문해요.":"연습 모드로 시작해요.",async()=>{const r=await api("/api/m/start",{mode:m});toast(r.msg);load()})}
function stopBot(h){ask(h==="sell"?"💰 전부 팔고 끄기":"⏹ 로봇 끄기",h==="sell"?"보유 종목을 전부 시장가로 팔고 멈춰요 (잠긴 종목도).":"보유 종목은 토스 서버 손절 주문을 걸어 둔 채로 멈춰요.",async()=>{const r=await api("/api/m/stop",{how:h});toast(r.msg);load()})}
function lockAll(){ask("🔒 전부 잠금","보유 종목을 전부 장 마감 정리 없이 들고 가요.",async()=>{const r=await api("/api/m/lockall",{});toast(r.msg);load()})}
function resume(){ask("▶️ 재개","계좌 낙폭 한도로 멈춘 매수를 다시 시작해요.",async()=>{const r=await api("/api/m/resume",{});toast(r.msg)})}
async function setCap(m){const v=$("cap"+m).value.trim();if(!v)return;let n=v.replace(/[,원$\s]/g,"");if(/만$/.test(n))n=String(parseFloat(n)*10000);const r=await api("/api/m/capital",{market:m,amount:n});toast(r.msg);load()}
function upd(){ask("🆕 업데이트","GitHub 최신 버전을 받아 시험 후 적용해요.",async()=>{const r=await api("/api/m/update",{});toast(r.msg)})}

nav();render();load();setInterval(()=>{if(!document.hidden)load()},30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script>
</body>
