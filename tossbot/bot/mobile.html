<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="토스봇">
<meta name="theme-color" content="#101318">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>토스봇</title>
<style>
:root{--bg:#F2F4F6;--card:#fff;--ink:#191F28;--muted:#6B7684;--line:#E5E8EB;--blue:#3182F6;--blue-soft:#E8F3FF;
  --up:#F04452;--up-soft:#FEEBEC;--ok:#12B76A;--ok-soft:#E7F8EF;--warn:#F79009;--warn-soft:#FEF4E6;--tab:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#101318;--card:#1B1F26;--ink:#E9ECEF;--muted:#98A2B3;--line:#2A3039;
  --blue-soft:#14243A;--up-soft:#3A1A1E;--ok-soft:#12301F;--warn-soft:#3A2A12;--tab:#161A20}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;height:100%;overflow:hidden;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;height:100dvh}
header{flex:none;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;display:flex;align-items:center;gap:8px}
header h1{font-size:20px;margin:0}
.badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--line);color:var(--muted)}
.badge.live{background:var(--up);color:#fff}.badge.paper{background:var(--blue-soft);color:var(--blue)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}.dot.on{background:var(--ok)}
#upd{margin-left:auto;font-size:12px;color:var(--muted)}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 16px 24px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:18px;padding:14px 16px}
.row{display:flex;align-items:center;gap:8px}.sp{flex:1}
.muted{color:var(--muted)}.small{font-size:12px}.b{font-weight:700}
.up{color:var(--up)}.down{color:var(--blue)}
.big{font-size:26px;font-weight:800;letter-spacing:-.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mk h3{margin:0 0 4px;font-size:14px}.mk .v{font-size:17px;font-weight:700}
.chip{display:inline-block;white-space:nowrap;flex:none;margin-bottom:2px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--muted);margin-right:4px}
.chip.A{background:var(--ok-soft);color:var(--ok)}.chip.B{background:var(--blue-soft);color:var(--blue)}.chip.C{background:var(--line)}
.chip.pos{background:var(--ok-soft);color:var(--ok)}.chip.neg{background:var(--up-soft);color:var(--up)}.chip.mid{background:var(--warn-soft);color:var(--warn)}
.chip.lock{background:var(--blue-soft);color:var(--blue)}
.h{border-top:1px solid var(--line);padding:12px 0}.h:first-child{border-top:0;padding-top:2px}
.h .nm{font-weight:700;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h .row,.pk .row{flex-wrap:nowrap}.pk .nm{white-space:nowrap;flex:none}
.kv{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted);margin-top:4px}.kv b{color:var(--ink);font-weight:600}
.why{font-size:12px;color:var(--muted);margin-top:6px}
.btns{display:flex;gap:8px;margin-top:10px}
button{font:inherit;font-weight:700;white-space:nowrap;border:0;border-radius:12px;padding:11px 12px;background:var(--line);color:var(--ink);cursor:pointer}
button.pri{background:var(--blue);color:#fff}button.dan{background:var(--up-soft);color:var(--up)}button.wide{width:100%}
button.sm{padding:8px 10px;font-size:13px;flex:1}
button:disabled{opacity:.45}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px}.seg button{flex:1;background:transparent;padding:8px;border-radius:10px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink)}
.pk{border-top:1px solid var(--line);padding:12px 0}.pk:first-child{border-top:0}
.ai{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--bg);font-size:13px}
.ai .t{font-weight:700;margin-bottom:2px}
.veto{background:var(--up-soft);color:var(--up);font-weight:700;padding:8px 12px;border-radius:12px;margin-top:8px;font-size:13px}
details summary{cursor:pointer;color:var(--muted);font-size:12px;margin-top:6px}
pre{white-space:pre-wrap;word-break:break-word;font:13px/1.55 -apple-system,"Apple SD Gothic Neo",sans-serif;margin:0}
.log{font-size:12px;line-height:1.5;border-top:1px solid var(--line);padding:6px 0}
input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);width:100%}
nav{flex:none;z-index:6;background:var(--tab);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:transparent;color:var(--muted);font-size:11px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px;line-height:1}nav button.on{color:var(--ink)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));background:var(--ink);color:var(--card);padding:12px 14px;border-radius:14px;font-size:14px;z-index:9;display:none;white-space:pre-wrap}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:none;align-items:flex-end}
.sheet .in{background:var(--card);width:100%;border-radius:20px 20px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 8px}
.empty{color:var(--muted);text-align:center;padding:18px 0;font-size:14px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:r 1s linear infinite;vertical-align:-2px}
@keyframes r{to{transform:rotate(360deg)}}
.bz{display:inline-block;font-size:12px;font-weight:800;padding:2px 9px;border-radius:99px;white-space:nowrap;flex:none}.bz.g{background:var(--ok);color:#fff}.bz.y{background:#F5B700;color:#1b1b1b}.bz.r{background:var(--up);color:#fff}.bz.n{background:var(--line);color:var(--muted)}
.tg2{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;flex:none}
.legend3{display:flex;gap:10px;font-size:12px;color:var(--muted);align-items:center;flex-wrap:wrap}
.bdg{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:var(--up);color:#fff;font-size:10px;line-height:16px;display:none;padding:0 4px}
.ib{border-top:1px solid var(--line);padding:11px 0}.ib:first-child{border-top:0}.ib .tt{font-weight:700}.ib.new .tt::before{content:'● ';color:var(--up)}
.tg{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}.tg:first-of-type{border-top:0}.tg input{width:auto;transform:scale(1.3)}
select{font:inherit;font-size:16px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.full{position:fixed;inset:0;z-index:8;background:var(--bg);overflow:auto;display:none;padding:0 16px calc(24px + env(safe-area-inset-bottom))}
.full .top{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 0 10px;z-index:5}
.full .top h2{margin:0;font-size:20px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cv{width:100%;height:300px;position:relative;z-index:0}
.legend2{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--muted);margin-top:6px}.legend2 i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}
.wl{font-size:13px;padding:3px 0}.wl.p{color:var(--ink)}.wl.n{color:var(--muted)}
.lad{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}.lad b{font-weight:700}
.res button{all:unset;display:flex;gap:8px;align-items:center;width:100%;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.nm[onclick]{cursor:pointer}

</style>
</head>
<body>
<header><h1>토스봇</h1><span id="mode" class="badge">…</span><span id="dot" class="dot"></span><span id="upd"></span><button class="sm" style="flex:0;padding:6px 10px;position:relative" onclick="openInbox()">🔔<span id="bdg" class="bdg"></span></button><button class="sm" style="flex:0;padding:6px 10px" onclick="openSearch()">🔍</button></header>
<main id="v"></main>
<nav id="nav"></nav>
<div class="toast" id="toast"></div>
<div class="sheet" id="sheet"><div class="in"><h3 id="sh-t"></h3><div id="sh-b" class="muted" style="margin-bottom:14px"></div>
  <div class="row"><button class="sp" onclick="closeSheet()">취소</button><button class="sp dan" id="sh-ok">실행</button></div></div></div>
<div class="full" id="stk"><div class="top"><button class="sm" style="flex:0" onclick="closeFull('stk')">‹ 닫기</button><h2 id="stk-t"></h2></div><div id="stk-b"></div></div>
<div class="full" id="prf"><div class="top"><button class="sm" style="flex:0" onclick="closeFull('prf')">‹ 닫기</button><h2>💰 판매 수익</h2></div><div id="prf-b"></div></div>
<div class="full" id="inb"><div class="top"><button class="sm" style="flex:0" onclick="closeFull('inb')">‹ 닫기</button><h2>🔔 알림함</h2></div><div id="inb-b"></div></div>
<div class="full" id="srch"><div class="top"><button class="sm" style="flex:0" onclick="closeFull('srch')">‹</button><input id="sq" placeholder="종목 이름이나 코드 (예: 삼성전자, 005930, NVDA)" autocomplete="off"></div><div id="sres" class="res"></div></div>
<script>
"use strict";
const TABS=[["home","🏠","홈"],["picks","🧭","후보"],["desk","🗂️","데스크"],["brief","📰","분석"],["more","⚙️","설정"]];
const FL={KR:"🇰🇷",US:"🇺🇸"}, NM={KR:"국장",US:"미장"};
let tab=localStorageGet("tab")||"home", pmk=localStorageGet("pmk")||"KR", D=null, P={}, T={}, logq="";
function localStorageGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function localStorageSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function money(v,mk){if(v==null||isNaN(v))return"–";return mk==="US"?"$"+Number(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}):Math.round(v).toLocaleString("ko-KR")+"원"}
function smoney(v,mk){if(v==null)return"–";return(v>0?"+":v<0?"-":"")+money(Math.abs(v),mk)}
function cls(v){return v>0?"up":v<0?"down":""}
function pct(v){return v==null?"–":(v>0?"+":"")+v.toFixed(2)+"%"}
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",4200)}
async function api(path,body){
  const o=body?{method:"POST",headers:{"Content-Type":"application/json","X-Req":"1"},body:JSON.stringify(body)}:{};
  const r=await fetch(path,o); if(r.status===401) throw new Error("접속 권한이 없어요"); return r.json()}
function ask(title,text,fn){$("sh-t").textContent=title;$("sh-b").textContent=text;$("sheet").style.display="flex";
  $("sh-ok").onclick=async()=>{closeSheet();await fn()}}
function closeSheet(){$("sheet").style.display="none"}
$("sheet").addEventListener("click",e=>{if(e.target.id==="sheet")closeSheet()});

function nav(){$("nav").innerHTML=TABS.map(([k,i,n])=>`<button class="${k===tab?"on":""}" onclick="go('${k}')"><span>${i}</span>${n}</button>`).join("")}
function go(k){tab=k;localStorageSet("tab",k);nav();render();$("v").scrollTo(0,0)}

async function load(){
  try{D=await api("/api/m/home");$("upd").textContent=new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});}
  catch(e){$("upd").textContent="연결 끊김"; if(!D){$("v").innerHTML=`<div class="card empty">${esc(e.message)}<br>Tailscale 이 켜져 있는지 확인하세요.</div>`;return}}
  $("mode").className="badge "+(D.running?(D.mode==="live"?"live":"paper"):"");
  $("mode").textContent=D.running?(D.mode==="live"?"실전":"연습"):"꺼짐";
  $("dot").className="dot"+(D.running?" on":"");
  if(tab==="home"||(tab==="brief"&&sub==="log"))render();
}

function render(){({home:vHome,picks:vPicks,desk:vDesk,brief:vBrief,log:vLog,more:vMore}[tab]||vHome)()}

let PL=null, PLt=0;
async function loadPlan(){if(Date.now()-PLt<120000&&PL)return;PLt=Date.now();try{PL=await api("/api/m/plan")}catch(e){PL={error:e.message}}if(tab==="home")vHome()}
function planCard(){
  if(!PL)return `<div class="card"><b>🛒 오늘 살 종목</b> <span class="spin"></span></div>`;
  if(PL.error)return "";
  const t=iso=>new Date(iso).toLocaleString("ko-KR",{month:"numeric",day:"numeric",weekday:"short",hour:"numeric",minute:"2-digit"});
  let h=`<div class="card"><div class="row"><b>🛒 오늘 살 종목</b><span class="sp"></span><span class="small muted">미리 계산한 예상</span></div>`;
  if(D&&!D.running)h+=`<div class="veto" style="background:var(--warn-soft);color:var(--warn)">로봇이 꺼져 있어서 지금은 아무것도 안 사요. 설정 → 🔴 실전 시작을 눌러야 아래대로 사요.</div>`;
  for(const mk of ["KR","US"]){const p=PL[mk];if(!p)continue;
    h+=`<div style="margin-top:12px"><div class="row"><b>${FL[mk]} ${NM[mk]}</b><span class="chip ${p.live?"B":""}">${p.live?"오늘 흐름 반영":"어젯밤 기준"}</span><span class="sp"></span><span class="small muted">내 시간 ${t(p.at)} 매수</span></div>`;
    const nb=(D&&D.nobuy||{})[mk];
    h+=`<div class="btns" style="margin-top:6px"><button class="sm${nb?" pri":""}" onclick="noBuy('${mk}',${!nb})">${nb?"✅ 오늘 다시 사기":"🛑 오늘 새로 사지 않기"}</button></div>`;
    if(nb)h+=`<div class="veto" style="background:var(--warn-soft);color:var(--warn)">오늘은 새로 안 사요 · 보유 종목 손절·관리는 그대로예요</div>`;
    if(p.index_today!=null)h+=`<div class="why">지수 오늘 ${p.index_today>0?"+":""}${p.index_today}%${p.index_today<=-2?" — 시장이 크게 빠지는 날이라 새로 안 사요":""}</div>`;
    h+=p.buy.length?p.buy.map(x=>`<div class="pk"><div class="row" style="flex-wrap:wrap;row-gap:4px"><span class="nm b" onclick="openStock('${mk}','${esc(x.code)}')">${esc(x.name)} ›</span><span class="chip ${x.grade}">${x.grade} ${x.score>0?"+":""}${Math.round(x.score)}</span>${x.small?`<span class="bz y">작게</span>`:`<span class="bz g">정상</span>`}<span class="sp"></span><span class="b">≈${x.qty}주</span><button class="sm" style="flex:0;margin-left:6px" onclick="exclude('${mk}','${esc(x.code)}','${esc(x.name)}',true)">빼기</button></div>
      <div class="kv"><span>약 <b>${esc(x.amount)}</b></span><span class="down">손절 ${money(x.stop,mk)}</span>${x.loss?`<span>최대 손실 약 ${esc(x.loss)}</span>`:""}${x.rr?`<span>손익비 ${x.rr}</span>`:""}</div>${x.earn_note?`<div class="why">📅 ${esc(x.earn_note)}</div>`:""}</div>`).join("")
      :`<div class="why">살 종목 없음${p.slots===0?" (빈자리 없음)":""}</div>`;
    if(p.wait.length)h+=`<div class="why">⏭ 예비: ${p.wait.map(x=>esc(x.name)).join(", ")} (앞 종목이 점검에서 빠지면 차례로)</div>`;
    if(p.skip.length)h+=`<details><summary>안 사는 후보 ${p.skip.length}개 · 이유</summary>${p.skip.map(x=>`<div class="why"${x.why.startsWith("🚫")?` onclick="exclude('${mk}','${esc(x.code)}','${esc(x.name)}',false)"`:""}>⛔ ${esc(x.name)} — ${esc(x.why)}</div>`).join("")}</details>`;
    h+=`</div>`}
  h+=`<div class="why" style="margin-top:8px">후보는 전날 밤에 뽑고, 장 마감 약 2시간 전(국장 13:20·미장 뉴욕 13:30)에 오늘 흐름으로 한 번 더 다시 뽑아요. 여기에 봇 규칙(점수·손익비·AI·업종·손실 한도)을 미리 적용한 예상이고, 매수 직전에 현재가·뉴스로 마지막 점검을 해요.</div></div>`;
  return h;
}
function vHome(){
  if(!D){$("v").innerHTML=`<div class="card empty"><span class="spin"></span> 불러오는 중</div>`;return}
  loadPlan();
  const hs=D.holdings||[]; let tot=0, val=0, fxok=true;
  hs.forEach(h=>{if(h.pnl!=null){if(h.fx){tot+=h.pnl*h.fx;val+=(h.value||0)*h.fx}else fxok=false}});
  let h=`<div class="card"><div class="muted small">보유 평가손익${fxok?" (원화 환산)":""}</div>
    <div class="big ${cls(tot)}">${hs.length?smoney(tot,"KR"):"보유 없음"}</div>
    ${D.month_pnl?`<div class="row" style="margin-top:8px;cursor:pointer" onclick="openProfits()"><span class="muted small">${+D.month_pnl.month.slice(5)}월 판매 수익 (확정)</span><span class="sp"></span><b class="${cls(D.month_pnl.krw)}">${smoney(D.month_pnl.krw,"KR")}</b><span class="small muted" style="margin-left:6px">${D.month_pnl.n}건 ›</span></div>`:""}</div>`;
  h+=`<div class="grid2">`+Object.entries(D.markets||{}).map(([mk,x])=>`<div class="card mk">
     <h3>${FL[mk]} ${NM[mk]}</h3><div class="muted small">${esc(x.phase||"")}</div>
     <div class="v ${cls(x.realized)}">${smoney(x.realized||0,mk)}</div><div class="muted small">오늘 확정 · 매수 ${x.trades||0}회</div>
     <div class="muted small">투자금 ${money(x.capital,mk)}${x.invested?` · 사용 ${money(x.invested,mk)}`:""}</div>
     ${x.halted?`<div class="small up">⛔ ${esc(x.halted)}</div>`:""}${x.error?`<div class="small up">❌ ${esc(x.error)}</div>`:""}</div>`).join("")+`</div>`;
  h+=planCard();
  h+=`<div class="card"><div class="row"><b>보유 종목</b><span class="sp"></span><button class="sm" style="flex:0" onclick="load()">새로고침</button></div>`;
  if(!hs.length) h+=`<div class="empty">로봇이 관리하는 보유 종목이 없어요</div>`;
  hs.forEach((x,i)=>{const mk=x.market, g=x.grade?`<span class="chip ${x.grade==="유지"?"pos":x.grade==="나쁨"?"neg":"mid"}">${esc(x.grade)}</span>`:"";
    h+=`<div class="h"><div class="row"><span class="nm" onclick="openStock('${mk}',D.holdings[${i}].symbol)">${FL[mk]} ${esc(x.name)} ›</span><span class="sp"></span><span class="b ${cls(x.pct)}">${pct(x.pct)}</span></div>
      <div style="margin-top:4px">${x.locked?'<span class="chip lock">🔒 잠금</span>':""}${x.swing?'<span class="chip">스윙</span>':""}${g}</div>
      <div class="kv"><span>${x.qty}주</span><span>현재 <b>${money(x.last,mk)}</b></span><span>평가 <b class="${cls(x.pnl)}">${smoney(x.pnl,mk)}</b></span>
      <span>산 값 ${money(x.entry,mk)}</span><span>손절선 ${money(x.sl,mk)}</span>${x.days?`<span>${x.days}일째</span>`:""}</div>
      ${(x.why||[]).length?`<div class="why">${x.why.slice(0,3).map(esc).join(" · ")}</div>`:""}

function drawChart(d,lines){
  const el=$("cv"); if(!el)return; el.innerHTML="";
  if(!d.bars||d.bars.length<2){el.style.height="auto";el.innerHTML=`<div class="empty">토스에서 일봉 자료를 못 받았어요. 잠시 뒤 다시 열어 보세요.</div>`;return}
  const dark=matchMedia("(prefers-color-scheme: dark)").matches, css=getComputedStyle(document.documentElement);
  const c=LightweightCharts.createChart(el,{height:300,layout:{background:{color:"transparent"},textColor:dark?"#98A2B3":"#6B7684",fontSize:11},
    grid:{vertLines:{visible:false},horzLines:{color:dark?"#232831":"#EEF0F3"}},rightPriceScale:{borderVisible:false},timeScale:{borderVisible:false},
    handleScroll:true,handleScale:true,crosshair:{mode:0},localization:{locale:"ko-KR"}});
  const t=b=>b[0];
  const cs=c.addCandlestickSeries({upColor:"#F04452",downColor:"#3182F6",borderVisible:false,wickUpColor:"#F04452",wickDownColor:"#3182F6"});
  if(d.market==="KR")cs.applyOptions({priceFormat:{type:"price",precision:0,minMove:1}});
  cs.setData(d.bars.map(b=>({time:t(b),open:b[1],high:b[2],low:b[3],close:b[4]})));
  const vs=c.addHistogramSeries({priceScaleId:"v",priceFormat:{type:"volume"}});c.priceScale("v").applyOptions({scaleMargins:{top:.82,bottom:0}});
  vs.setData(d.bars.map(b=>({time:t(b),value:b[5],color:b[4]>=b[1]?"rgba(240,68,82,.35)":"rgba(49,130,246,.35)"})));
  for(const [n,col] of [[5,"#12B76A"],[20,"#F79009"],[60,"#9B8AFB"]]){const s=c.addLineSeries({color:col,lineWidth:1,priceLineVisible:false,lastValueVisible:false});
    const out=[];for(let i=n-1;i<d.bars.length;i++){let a=0;for(let j=i-n+1;j<=i;j++)a+=d.bars[j][4];out.push({time:t(d.bars[i]),value:a/n})}s.setData(out)}
  for(const [n,v,col] of lines) if(v) cs.createPriceLine({price:v,color:col,lineWidth:1,lineStyle:2,axisLabelVisible:true,title:n});
  c.timeScale().setVisibleLogicalRange({from:Math.max(0,d.bars.length-90),to:d.bars.length+2});
  chartObj=c;
}

  el.innerHTML=`<div class="row" onclick="localStorageSet('pushOpen',localStorageGet('pushOpen')==='1'?'0':'1');pushCard()" style="cursor:pointer"><b>🔔 알림</b><span class="small muted">${on?"✅ 켜짐":"꺼짐"}</span><span class="sp"></span><span class="small muted">${open?"접기 ▲":"설정 ▼"}</span></div>

    ${!standalone()&&/iPhone|iPad/.test(navigator.userAgent)?`<div class="veto" style="background:var(--warn-soft);color:var(--warn)">아이폰은 Safari → 공유 → '홈 화면에 추가'로 설치한 앱 안에서만 알림을 켤 수 있어요. 홈 화면 아이콘으로 열어서 다시 눌러 주세요.</div>`:""}
    ${can?`<div class="btns"><button class="sm pri" onclick="enablePush()">${on?"다시 연결":"이 휴대폰으로 알림 받기"}</button><button class="sm" onclick="testPush()">시험 알림</button></div>`:`<div class="why">이 브라우저는 알림을 지원하지 않아요.</div>`}
    <div style="margin-top:10px">${tg("trade","사고팔 때","샀어요 · 팔았어요(이익/손실) · 일부 익절")}${tg("plan","오늘 살 후보","장 시작 전 판단표가 나오면")}${tg("move_hold","보유 종목 급등·급락","+5% · +10% · -5% · -8%")}${tg("move_watch","후보 종목 급등","후보·데스크 종목이 +5% 넘게 오를 때")}${tg("move_market","시장 전체 급등","+15% 넘는 종목 (하루 최대 5개)")}${tg("skip","안 산 이유","후보를 건너뛸 때")}${tg("warn","확인이 필요할 때","주문 실패·로봇 오류")}</div>
    <div class="row" style="margin-top:8px"><span class="small">텔레그램</span><span class="sp"></span><select onchange="setPref('telegram',this.value)">${[["off","안 받기 (앱 알림만)"],["short","짧게"],["full","자세히(예전처럼)"]].map(([v,n])=>`<option value="${v}" ${P.telegram===v?"selected":""}>${n}</option>`).join("")}</select></div>
    <div class="why">자잘한 알림(보유 점검 등)은 🔔 알림함에만 쌓여요.</div></div>`;
}
async function enablePush(){
  try{
    if(!PU||!PU.key){toast("서버 알림 키가 없어요. 업데이트 후 다시 해 주세요");return}
    const perm=await Notification.requestPermission(); if(perm!=="granted"){toast("알림 허용을 눌러야 받을 수 있어요 (설정 → 알림에서 바꿀 수 있어요)");return}
    const reg=await navigator.serviceWorker.ready;
    const k=PU.key.replace(/-/g,"+").replace(/_/g,"/"), raw=atob(k+"=".repeat((4-k.length%4)%4)), key=new Uint8Array([...raw].map(c=>c.charCodeAt(0)));
    let sub=await reg.pushManager.getSubscription(); if(sub)await sub.unsubscribe();
    sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key});
    const r=await api("/api/m/push/sub",{sub:sub.toJSON()});toast(r.msg);pushCard();
  }catch(e){toast("알림 켜기 실패: "+e.message)}
}
async function testPush(){const r=await api("/api/m/push/test",{});toast(r.msg)}
async function setPref(k,v){await api("/api/m/push/prefs",{prefs:{[k]:v}});if(PU)PU.prefs[k]=v}
function route(){const h=decodeURIComponent(location.hash||"");
  if(h.startsWith("#stock=")){const [m,c]=h.slice(7).split(":");if(m&&c)openStock(m,c)}
  else if(h==="#inbox")openInbox();
  if(h)history.replaceState(null,"",location.pathname)}
window.addEventListener("hashchange",route);

nav();render();load();route();badge();setInterval(()=>{if(!document.hidden)badge()},60000);
setInterval(()=>{if(document.hidden)return;DK={};P={};PLt=0;if(tab==="desk")vDesk();else if(tab==="picks")vPicks();else if(tab==="home")loadPlan()},300000);   // 5분마다 판정·후보 새로setInterval(()=>{if(!document.hidden)load()},30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script>
